[package]
name = "tinyprune-cli"
version = "0.0.0"
edition = "2021"
publish = false
description = "Unreleased IPC-only TinyPrune command-line client"

[[bin]]
name = "tinyprune"
path = "src/main.rs"

[dependencies]
tinyprune-ipc = { path = "../tinyprune-ipc" }
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
