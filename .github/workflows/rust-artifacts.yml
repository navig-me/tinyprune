name: Rust dev artifacts

# UNRELEASED development artifacts for the Rust daemon, CLI and UI. This workflow
# never publishes, signs, tags or creates releases, and uses no secrets. Outputs are
# workflow artifacts that expire after 7 days. macOS is build-and-run-check only: the
# Swift app owns the macOS daemon, so no macOS package is produced.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-artifacts.yml"

permissions:
  contents: read

concurrency:
  group: rust-artifacts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-14]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Build daemon and CLI (release)
        run: cargo build --release --locked -p tinyprune-daemon -p tinyprune-cli

      - name: Check --version of each binary
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" != "Windows" ] || ext=".exe"
          daemon_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' tinyprune-daemon/Cargo.toml | sed -n '1p')"
          cli_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' tinyprune-cli/Cargo.toml | sed -n '1p')"
          out="$(target/release/tinyprune-agentd$ext --version)"; echo "$out"
          printf '%s\n' "$out" | grep -F -- "$daemon_version"
          out="$(target/release/tinyprune$ext --version)"; echo "$out"
          printf '%s\n' "$out" | grep -F -- "$cli_version"

      # The UI is best-effort: it needs GTK/WebKit packages on Linux and a Windows icon
      # that may not exist yet. A failure here must not block the daemon/CLI artifacts;
      # the package then simply omits the UI. macOS is excluded (Swift app owns it).
      - name: Install UI system packages (Linux)
        id: ui_deps
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - name: Build UI (release, best effort)
        id: ui
        if: runner.os != 'macOS' && steps.ui_deps.outcome != 'failure'
        continue-on-error: true
        run: cargo build --release --locked --manifest-path ui/Cargo.toml

      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ui=()
          if [ "${{ steps.ui.outcome }}" = "success" ]; then ui=(--ui-bin ui/target/release/tinyprune-ui); fi
          packaging/linux/package.sh --bin-dir target/release --out-dir "$GITHUB_WORKSPACE/dist" --arch x86_64 "${ui[@]}"
          # Smoke the package itself (stub-free): extract and list contents.
          tar -tzf "$GITHUB_WORKSPACE"/dist/*.tar.gz
          packaging/linux/test-install.sh --bin-dir target/release
          cd "$GITHUB_WORKSPACE/dist"
          rm -f SHA256SUMS
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $pkgArgs = @('-BinDir', 'target\release', '-OutDir', $dist)
          if ('${{ steps.ui.outcome }}' -eq 'success') { $pkgArgs += @('-UiBin', 'ui\target\release\tinyprune-ui.exe') }
          & packaging\windows\package.ps1 @pkgArgs
          # Parse-check the install scripts on a real PowerShell.
          foreach ($s in 'install.ps1', 'uninstall.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "packaging\windows\$s"), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          Get-ChildItem $dist -Filter *.zip | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path (Join-Path $dist 'SHA256SUMS') -Encoding ascii
          Get-Content (Join-Path $dist 'SHA256SUMS')

      - name: Upload development artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tinyprune-rust-dev-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
