name: Rust dev artifacts

# UNRELEASED development artifacts for the Rust daemon, CLI and UI. This workflow
# never publishes, signs, tags or creates releases, and uses no secrets. Outputs are
# workflow artifacts that expire after 7 days. macOS is build-and-run-check only: the
# Swift app owns the macOS daemon, so no macOS package is produced.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-artifacts.yml"

permissions:
  contents: read

concurrency:
  group: rust-artifacts-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # ADR 0012 updater identity, compiled into the binaries and stamped into VERSION. The build number
      # is this run's number (a counter private to this workflow, see RELEASING.md). The production public
      # key is NOT set here: it is embedded only by the "Embed production update key" step below, and only
      # for a workflow_dispatch run on main. Pull-request and other-branch builds therefore never carry it
      # and have updates disabled. No secret is used by this workflow.
      TINYPRUNE_BUILD: ${{ github.run_number }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-14]
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - name: Stamp updater version
        run: echo "TINYPRUNE_VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' tinyprune-daemon/Cargo.toml | sed -n '1p')" >> "$GITHUB_ENV"

      # The key is public, non-secret configuration (the ADR 0009 Ed25519 public key). It lives in the
      # repository variable TINYPRUNE_UPDATE_PUBLIC_KEY, which a maintainer must keep equal to the
      # `update-feed` Environment's SPARKLE_ED25519_PUBLIC_KEY; rust-update-feed.yml refuses to sign when
      # the embedded key differs from the Environment's. Unset variable: binaries without a key (updates
      # disabled), which rust-update-feed.yml rejects.
      - name: Embed production update key (workflow_dispatch on main only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.TINYPRUNE_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$UPDATE_PUBLIC_KEY" ]]; then
            echo "::warning::Repository variable TINYPRUNE_UPDATE_PUBLIC_KEY is unset: binaries have updates disabled and cannot be promoted to a feed."
          else
            [[ "$UPDATE_PUBLIC_KEY" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo 'TINYPRUNE_UPDATE_PUBLIC_KEY is not a base64 32-byte Ed25519 public key'; exit 1; }
            echo "TINYPRUNE_UPDATE_PUBLIC_KEY=$UPDATE_PUBLIC_KEY" >> "$GITHUB_ENV"
          fi

      # Separate invocations keep the agent free of the updater's HTTP/TLS client (feature unification
      # is per invocation). The launcher is the Windows Scheduled Task entry point (ADR 0012).
      - name: Build daemon and CLI (release)
        run: |
          cargo build --release --locked -p tinyprune-daemon
          cargo build --release --locked -p tinyprune-cli
          cargo build --release --locked -p tinyprune-update --bin tinyprune-launcher

      - name: Check --version of each binary
        run: |
          set -euo pipefail
          ext=""; [ "$RUNNER_OS" != "Windows" ] || ext=".exe"
          daemon_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' tinyprune-daemon/Cargo.toml | sed -n '1p')"
          cli_version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' tinyprune-cli/Cargo.toml | sed -n '1p')"
          out="$(target/release/tinyprune-agentd$ext --version)"; echo "$out"
          printf '%s\n' "$out" | grep -F -- "$daemon_version"
          out="$(target/release/tinyprune$ext --version)"; echo "$out"
          printf '%s\n' "$out" | grep -F -- "$cli_version"

      # The UI is best-effort: it needs GTK/WebKit packages on Linux and a Windows icon
      # that may not exist yet. A failure here must not block the daemon/CLI artifacts;
      # the package then simply omits the UI. macOS is excluded (Swift app owns it).
      - name: Install UI system packages (Linux)
        id: ui_deps
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - name: Build UI (release, best effort)
        id: ui
        if: runner.os != 'macOS' && steps.ui_deps.outcome != 'failure'
        continue-on-error: true
        run: cargo build --release --locked --manifest-path ui/Cargo.toml

      - name: Package (Linux tarball)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ui=()
          if [ "${{ steps.ui.outcome }}" = "success" ]; then ui=(--ui-bin ui/target/release/tinyprune-ui); fi
          packaging/linux/package.sh --bin-dir target/release --out-dir "$GITHUB_WORKSPACE/dist" --arch x86_64 "${ui[@]}"
          # Smoke the package itself (stub-free): extract and list contents.
          tar -tzf "$GITHUB_WORKSPACE"/dist/*.tar.gz
          packaging/linux/test-install.sh --bin-dir target/release
          cd "$GITHUB_WORKSPACE/dist"
          rm -f SHA256SUMS
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Docker install test (Ubuntu 24.04, real systemd --user)
        if: runner.os == 'Linux'
        run: packaging/linux/docker-test.sh --archive "$(ls "$GITHUB_WORKSPACE"/dist/*.tar.gz)"

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $pkgArgs = @{ BinDir = 'target\release'; OutDir = $dist }
          if ('${{ steps.ui.outcome }}' -eq 'success') { $pkgArgs.UiBin = 'ui\target\release\tinyprune-ui.exe' }
          & packaging\windows\package.ps1 @pkgArgs
          # Parse-check the install scripts on a real PowerShell.
          foreach ($s in 'install.ps1', 'uninstall.ps1', 'install-managed.ps1', 'uninstall-managed.ps1') {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "packaging\windows\$s"), [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          }
          Get-ChildItem $dist -Filter *.zip | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Path (Join-Path $dist 'SHA256SUMS') -Encoding ascii
          Get-Content (Join-Path $dist 'SHA256SUMS')

      - name: Install / run / uninstall test (Scheduled Task)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = (Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE 'dist') -Filter *.zip | Select-Object -First 1).FullName
          $work = Join-Path $env:RUNNER_TEMP 'tp-install'
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $zip -DestinationPath $work
          $pkg = (Get-ChildItem $work -Directory | Select-Object -First 1).FullName
          $prefix = Join-Path $env:RUNNER_TEMP 'tp-prefix'
          $taskName = 'TinyPrune Agent (dev)'
          $data = Join-Path $env:LOCALAPPDATA 'TinyPrune'
          function Dump {
            Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue | Format-List *
            Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue | Format-List *
            Get-Process tinyprune* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, Path
          }
          function Assert($ok, $what) { if (-not $ok) { Dump; throw "FAIL: $what" } }
          try {
            # The hosted runner user is an administrator; -AllowElevated still registers a Limited-token task.
            & (Join-Path $pkg 'install.ps1') -Prefix $prefix -Start -AllowElevated
            Assert (Test-Path (Join-Path $prefix 'bin\tinyprune-agentd.exe')) 'agent binary installed'
            Assert ($null -ne (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) 'task registered'

            $cli = Join-Path $prefix 'bin\tinyprune.exe'
            $deadline = (Get-Date).AddSeconds(90)
            do {
              & $cli status *> $null
              $up = ($LASTEXITCODE -eq 0)
              if (-not $up) { Start-Sleep -Milliseconds 500 }
            } until ($up -or (Get-Date) -gt $deadline)
            Assert $up 'task-started agent answers tinyprune status'
            Assert ((Get-Process -Name tinyprune-agentd -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq (Join-Path $prefix 'bin\tinyprune-agentd.exe') })) 'agent process runs from install prefix'

            $root = Join-Path $env:RUNNER_TEMP 'tp-install-root'
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            & $cli roots add install-root $root Install | Out-Null
            Assert ($LASTEXITCODE -eq 0) 'roots add'
            $rule = @{
              id = '33333333-3333-4333-8333-333333333333'; name = 'Install test'
              scope = @{ path = $root; recursive = $true }
              matcher = @{ itemKind = 'fileOrDirectory'; exactNames = @(); globPatterns = @('*') }
              expiryBasis = 'modified'; lifetime = 3600; gracePeriod = 1; action = 'trashItem'; state = 'preview'; matchMode = 'scoped'
            } | ConvertTo-Json -Depth 5
            $ruleFile = Join-Path $env:RUNNER_TEMP 'tp-install-rule.json'
            [IO.File]::WriteAllText($ruleFile, $rule, (New-Object Text.UTF8Encoding($false)))
            & $cli rules add $ruleFile | Out-Null
            Assert ($LASTEXITCODE -eq 0) 'rules add'
            $rules = (& $cli rules) -join "`n"
            Assert ($rules -match '33333333-3333-4333-8333-333333333333' -and $rules -match 'preview') 'preview rule listed'
            $rootsText = ((& $cli roots list) -join "`n").Replace('\', '/')
            Assert ($rootsText -match [regex]::Escape($root.Replace('\', '/').TrimStart('/'))) 'root listed'

            & (Join-Path $pkg 'uninstall.ps1') -Prefix $prefix
            Assert ($null -eq (Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue)) 'task removed'
            Assert (-not (Test-Path (Join-Path $prefix 'bin\tinyprune-agentd.exe'))) 'agent binary removed'
            Assert (-not (Test-Path (Join-Path $prefix 'bin\tinyprune.exe'))) 'CLI binary removed'
            Assert (Test-Path -LiteralPath $data) 'uninstall keeps agent data'
            Assert ($null -eq (Get-Process -Name tinyprune-agentd -ErrorAction SilentlyContinue)) 'agent stopped'

            & (Join-Path $pkg 'install.ps1') -Prefix $prefix -AllowElevated -NoTask
            & (Join-Path $pkg 'uninstall.ps1') -Prefix $prefix -Purge
            Assert (-not (Test-Path -LiteralPath $data)) 'purge removes agent data'
            Assert (-not (Test-Path -LiteralPath $prefix)) 'prefix removed'
            Assert (Test-Path -LiteralPath $root) 'managed folder untouched'
          } catch {
            Dump
            throw
          }

      - name: Upload development artifact
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tinyprune-rust-dev-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  # ADR 0012: the managed Windows update path on a real runner, mirroring rust/tests-e2e/update-docker.sh.
  # Non-production: the Ed25519 key is generated inside the job and discarded with it, the feed is served from
  # a loopback listener, and the test binaries are built with the `test-overrides` features that released
  # artifacts never use. No secret is read. The runner is disposable, which the script's guard requires.
  windows-update-e2e:
    name: Windows managed update end-to-end (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        shell: bash
        working-directory: rust
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Update end-to-end (throwaway key, real Scheduled Task, real agent)
        shell: pwsh
        env:
          TINYPRUNE_E2E_ALLOW_INSTALL: "1"
        run: rust\tests-e2e\update-windows.ps1
