name: Build native package

on:
  pull_request:
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Scripts/**
      - .github/workflows/native-package.yml
  push:
    branches: [main]
    paths:
      - Package.swift
      - Sources/**
      - Tests/**
      - Scripts/**
      - .github/workflows/native-package.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test native package
        run: swift test
      - name: Run deterministic domain smoke
        run: swift run TinyPruneDomainCheck
      - name: Build native products
        run: swift build --configuration release
