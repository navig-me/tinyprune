name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-sites:
    name: Validate ${{ matrix.site }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        site: [website, docs]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Validate static site
        run: npm --prefix ${{ matrix.site }} run check
