name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-sites:
    name: Validate ${{ matrix.site }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        site: [website, docs]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Validate static site
        run: npm --prefix ${{ matrix.site }} run check

  native:
    name: Native acceptance (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # macOS 14 defaults to Xcode 15.4 (Swift 5); select its installed Swift 6 toolchain.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md
      - name: Select Xcode 16.2 on deployment-floor runner
        if: matrix.runner == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      - name: Native behavior and safety suite
        run: |
          set -euo pipefail
          mkdir -p .build
          swift test 2>&1 | tee .build/native-tests.log
      - name: Real domain and filesystem fixtures
        run: |
          set -euo pipefail
          swift run TinyPruneDomainCheck
          swift run TinyPruneEngineCheck 2>&1 | tee .build/engine-smoke.log
      - name: Native view and lifecycle smoke
        id: ui
        run: |
          set -euo pipefail
          swift run TinyPruneUISnapshots 2>&1 | tee .build/ui-smoke.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          line = next(line for line in Path('.build/ui-smoke.log').read_text().splitlines() if line.startswith('PNG output directory: '))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('snapshots=' + line.split(': ', 1)[1] + '\n')
          PY
      - name: Package and verify direct preview
        run: |
          set -euo pipefail
          swift Scripts/package-app.swift
          Scripts/verify-signing.sh .build/package/TinyPrune.app
      - name: Unattended Homebrew installation on fresh runner
        run: |
          set -euo pipefail
          TINYPRUNE_DISTRIBUTION=homebrew swift Scripts/package-app.swift
          Scripts/verify-signing.sh .build/package/TinyPrune.app
          python3 Scripts/smoke-homebrew.py 2>&1 | tee .build/homebrew-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-acceptance-${{ matrix.runner }}
          path: |
            .build/*.log
            ${{ steps.ui.outputs.snapshots }}
          retention-days: 7
