name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an unfinished run for the same ref, so macOS jobs do not pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect native changes
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.diff.outputs.native }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      # Website, docs and Markdown-only changes cannot affect the native app, so skip the macOS matrix for them.
      # Any doubt (manual run, unknown base, new branch) runs everything.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          base=""
          if [[ "$EVENT" == pull_request ]]; then base="$PR_BASE"; elif [[ "$EVENT" == push ]]; then base="$BEFORE"; fi
          native=true
          if [[ -n "$base" && "$base" != 0000000000000000000000000000000000000000 ]] \
             && files="$(git diff --name-only "$base" "$GITHUB_SHA" 2>/dev/null)" && [[ -n "$files" ]]; then
            if ! grep -qvE '^(website/|docs/|rust/|[^/]+\.md$|\.github/workflows/(deploy-pages|publish-update-feed|homebrew)\.yml$)' <<<"$files"; then
              native=false
            fi
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "Native jobs needed: $native"

  # Cheap and independent of the `changes` filter: runs on every pull request and push (ADR 0013).
  versions:
    name: Version consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Marketing version, crates, lockfiles, CHANGELOG and RELEASES.md agree
        run: python3 Scripts/check-versions.py

  static-sites:
    name: Validate ${{ matrix.site }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        site: [website, docs]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Validate static site
        run: npm --prefix ${{ matrix.site }} run check

  # The Rust core must reproduce the Swift reference exactly on every platform it will ship for (ADR 0010).
  rust-core:
    name: Rust core golden fixtures (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022, macos-14]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component clippy
      - name: Golden fixtures
        run: cargo test --locked --no-fail-fast
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build release binaries (agent and CLI)
        run: cargo build --release --locked -p tinyprune-daemon -p tinyprune-cli
      # Real tinyprune-agentd + tinyprune against a temp fixture with isolated data/socket/Trash dirs.
      - name: End-to-end smoke (Unix)
        if: runner.os != 'Windows'
        env:
          SMOKE_SKIP_BUILD: "1"
        run: bash tests-e2e/smoke.sh
      - name: End-to-end smoke (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SMOKE_SKIP_BUILD: "1"
        run: ./tests-e2e/smoke.ps1
      # 100k-entry benchmark against the real agent. Numbers are reported, not gated: thresholds are only compared
      # with the Swift PhaseTwoBenchmarkTests bounds in the table, and a benchmark failure never fails CI.
      - name: Benchmark (non-gating; table goes to the job summary)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          export TINYPRUNE_BENCH_OUT="$GITHUB_STEP_SUMMARY"
          cargo test --release --locked -p tinyprune-daemon --test bench -- --ignored --nocapture
      - name: SQLite durability and index microbenchmark (non-gating)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          export TINYPRUNE_BENCH_OUT="$GITHUB_STEP_SUMMARY"
          cargo test --release --locked -p tinyprune-store --test bench -- --ignored --nocapture
          cargo test --release --locked -p tinyprune-store --lib bench_put_decisions_checkpoint_and_readers -- --ignored --nocapture

  # Frontend tests plus a Tauri 2 compile check of the in-development desktop shell (rust/ui is its own workspace).
  rust-ui:
    name: Rust UI (frontend tests, Tauri check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Frontend tests
        run: node --test rust/ui/frontend/tests/frontend.test.js
      # Package list from https://v2.tauri.app/start/prerequisites/#linux (Debian/Ubuntu).
      - name: Install Tauri 2 Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust/rust-toolchain.toml)" --profile minimal
      - name: Check Tauri shell
        run: cargo check --locked --manifest-path rust/ui/Cargo.toml

  # The Tauri shell on a real Windows runner: WebView2, tauri-driver + Microsoft Edge WebDriver, the real agent over a
  # named pipe. Non-gating while the Windows harness is unproven; the Linux equivalent is rust/ui/docker.
  rust-ui-windows:
    name: Rust UI on Windows (WebView2, real agent; non-gating)
    runs-on: windows-2022
    timeout-minutes: 60
    continue-on-error: true
    env:
      TINYPRUNE_BIN_DIR: ${{ github.workspace }}\rust\target\release
      TINYPRUNE_UI_APP: ${{ github.workspace }}\rust\ui\target\release\tinyprune-ui.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Paths under the runner temp directory
        shell: pwsh
        run: |
          "TINYPRUNE_UI_AXE=$env:RUNNER_TEMP\a11y\node_modules\axe-core\axe.min.js" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TINYPRUNE_UI_OUT=$env:RUNNER_TEMP\ui-out" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust/rust-toolchain.toml)" --profile minimal
      - name: Frontend tests
        run: node --test rust/ui/frontend/tests/frontend.test.js
      - name: Build agent, CLI and UI (release, locked)
        shell: bash
        run: |
          cargo build --release --locked --manifest-path rust/Cargo.toml -p tinyprune-daemon -p tinyprune-cli
          cargo build --release --locked --manifest-path rust/ui/Cargo.toml -p tinyprune-ui
      - name: Install tauri-driver 2.0.4
        run: cargo install tauri-driver --version 2.0.4 --locked
      - name: WebView2 runtime and matching Edge WebDriver
        shell: pwsh
        run: ./rust/ui/windows/setup-webdriver.ps1
      - name: Install axe-core 4.10.3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\a11y" | Out-Null
          Push-Location "$env:RUNNER_TEMP\a11y"
          npm install --save-exact axe-core@4.10.3
          Pop-Location
      - name: Real-agent UI smoke (WebDriver)
        shell: pwsh
        run: ./rust/ui/windows/run-smoke.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: rust-ui-windows
          path: ${{ runner.temp }}\ui-out
          retention-days: 7

  native:
    name: Native acceptance (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      # macOS 14 defaults to Xcode 15.4 (Swift 5); select its installed Swift 6 toolchain.
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md
      - name: Select Xcode 16.2 on deployment-floor runner
        if: matrix.runner == 'macos-14'
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
      # Compiled modules only; restored by Swift version so a toolchain change never reuses stale objects.
      - name: Cache SwiftPM build products
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            .build/checkouts
            .build/repositories
            .build/artifacts
            .build/arm64-apple-macosx
            .build/x86_64-apple-macosx
          key: swiftpm-${{ matrix.runner }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swiftpm-${{ matrix.runner }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
      # The 100k-entry index benchmark and 60 second idle soak take minutes; one runner is enough to guard them.
      - name: Native behavior and safety suite
        env:
          SKIP_BENCHMARK: ${{ matrix.runner == 'macos-15' && 'no' || 'yes' }}
        run: |
          set -euo pipefail
          mkdir -p .build
          skip=()
          if [[ "$SKIP_BENCHMARK" == yes ]]; then skip=(--skip PhaseTwoBenchmarkTests); fi
          # bash 3.2 on macOS treats an empty array as unbound under set -u, hence the ${var+...} guard.
          swift test ${skip[@]+"${skip[@]}"} 2>&1 | tee .build/native-tests.log
      - name: Real domain and filesystem fixtures
        run: |
          set -euo pipefail
          swift run TinyPruneDomainCheck
          swift run TinyPruneEngineCheck 2>&1 | tee .build/engine-smoke.log
      - name: Native view and lifecycle smoke
        id: ui
        run: |
          set -euo pipefail
          swift run TinyPruneUISnapshots 2>&1 | tee .build/ui-smoke.log
          python3 - <<'PY'
          import os
          from pathlib import Path
          line = next(line for line in Path('.build/ui-smoke.log').read_text().splitlines() if line.startswith('PNG output directory: '))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('snapshots=' + line.split(': ', 1)[1] + '\n')
          PY
      - name: Package and verify direct preview
        run: |
          set -euo pipefail
          swift Scripts/package-app.swift
          Scripts/verify-signing.sh .build/package/TinyPrune.app
      - name: Unattended Homebrew installation on fresh runner
        run: |
          set -euo pipefail
          TINYPRUNE_DISTRIBUTION=homebrew swift Scripts/package-app.swift
          Scripts/verify-signing.sh .build/package/TinyPrune.app
          python3 Scripts/smoke-homebrew.py 2>&1 | tee .build/homebrew-smoke.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-acceptance-${{ matrix.runner }}
          path: |
            .build/*.log
            ${{ steps.ui.outputs.snapshots }}
          retention-days: 7
