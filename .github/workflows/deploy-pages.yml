name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
    inputs:
      site:
        description: Static site to deploy
        type: choice
        required: true
        default: both
        options: [website, docs, both]

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production-${{ github.event.inputs.site || 'changed-sites' }}
  cancel-in-progress: false

jobs:
  website:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.site == 'website' || inputs.site == 'both') || github.event_name == 'push' }}
    name: Deploy tinyprune.com
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages-production
      url: https://tinyprune.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Validate website
        run: npm --prefix website run check
      - name: Generate download stats
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node website/scripts/stats.mjs
      - name: Report missing deployment credentials
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo 'Cloudflare Pages deploy skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the cloudflare-pages-production environment.'
      - name: Deploy website
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.144.0 pages deploy website --project-name=tinyprune --branch=main

  docs:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.site == 'docs' || inputs.site == 'both') || github.event_name == 'push' }}
    name: Deploy docs.tinyprune.com
    runs-on: ubuntu-24.04
    environment:
      name: cloudflare-pages-production
      url: https://docs.tinyprune.com
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.14.0
      - name: Validate documentation
        run: npm --prefix docs run check
      - name: Report missing deployment credentials
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID == '' || env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo 'Cloudflare Pages deploy skipped: configure CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in the cloudflare-pages-production environment.'
      - name: Deploy documentation
        if: ${{ env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_API_TOKEN != '' }}
        run: npx --yes wrangler@4.144.0 pages deploy docs --project-name=tinyprune-docs --branch=main
