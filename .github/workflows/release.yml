name: Release macOS application

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string
      publish:
        description: Publish GitHub release after signing and notarization
        required: true
        default: false
        type: boolean

# Least privilege: the token only needs to create the release; signing material comes
# from the protected `release` environment (see .github/DEPLOYMENT.md and ADR 0004).
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    environment: release
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate tag and signing configuration
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag must look like vX.Y.Z"; exit 1; }
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          for name in CERTIFICATE CERTIFICATE_PASSWORD NOTARY_KEY NOTARY_KEY_ID NOTARY_ISSUER_ID TEAM_ID; do
            [[ -n "${!name}" ]] || { echo "Missing release secret: $name"; exit 1; }
          done
          {
            echo "TINYPRUNE_VERSION=${RELEASE_TAG#v}"
            echo "TINYPRUNE_BUILD=$GITHUB_RUN_NUMBER"
            echo "TINYPRUNE_EXPECTED_TEAM_ID=$TEAM_ID"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/tinyprune-signing.keychain-db"
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
            echo "DMG_PATH=$RUNNER_TEMP/TinyPrune-${RELEASE_TAG#v}.dmg"
            echo "STAGING_PATH=$RUNNER_TEMP/TinyPrune-dmg"
          } >> "$GITHUB_ENV"
      - name: Quality gates
        run: |
          set -euo pipefail
          swift test
          swift run TinyPruneDomainCheck
          swift run TinyPruneEngineCheck
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_password="$(uuidgen)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/developer-id.p12"
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*\([0-9A-F]\{40\}\) "Developer ID Application:.*(\(.*\))".*/\1 \2/p' | head -1)"
          [[ -n "$identity" ]] || { echo "No Developer ID Application identity in the imported certificate"; exit 1; }
          [[ "${identity#* }" == "$TINYPRUNE_EXPECTED_TEAM_ID" ]] || { echo "Certificate Team ID does not match APPLE_TEAM_ID"; exit 1; }
          echo "TINYPRUNE_SIGN_IDENTITY=${identity%% *}" >> "$GITHUB_ENV"
      - name: Build, sign, and package universal app
        run: swift Scripts/package-app.swift
      - name: Verify signing before notarization
        run: Scripts/verify-signing.sh --release --pre-notarize .build/package/TinyPrune.app
      - name: Notarize and staple app
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$NOTARY_KEY_PATH"
          ditto -c -k --keepParent .build/package/TinyPrune.app "$RUNNER_TEMP/TinyPrune.zip"
          xcrun notarytool submit "$RUNNER_TEMP/TinyPrune.zip" --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --output-format json > "$RUNNER_TEMP/notary-app.json"
          cat "$RUNNER_TEMP/notary-app.json"
          if ! jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-app.json" >/dev/null; then
            xcrun notarytool log "$(jq -r .id "$RUNNER_TEMP/notary-app.json")" --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            exit 1
          fi
          xcrun stapler staple .build/package/TinyPrune.app
      - name: Verify notarized app
        run: Scripts/verify-signing.sh --release .build/package/TinyPrune.app
      - name: Create signed distribution DMG
        run: |
          set -euo pipefail
          rm -rf "$STAGING_PATH"
          mkdir -p "$STAGING_PATH"
          ditto .build/package/TinyPrune.app "$STAGING_PATH/TinyPrune.app"
          ln -s /Applications "$STAGING_PATH/Applications"
          hdiutil create -volname TinyPrune -srcfolder "$STAGING_PATH" -fs HFS+ -format UDZO -ov "$DMG_PATH"
          codesign --force --sign "$TINYPRUNE_SIGN_IDENTITY" --timestamp "$DMG_PATH"
          codesign --verify --strict --verbose=2 "$DMG_PATH"
      - name: Notarize and validate DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun notarytool submit "$DMG_PATH" --key "$NOTARY_KEY_PATH" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait --output-format json > "$RUNNER_TEMP/notary-dmg.json"
          cat "$RUNNER_TEMP/notary-dmg.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-dmg.json" >/dev/null
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"
      - name: Verify the app inside the DMG
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/dmg-mount"
          mkdir -p "$mount_point"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force' EXIT
          Scripts/verify-signing.sh --release "$mount_point/TinyPrune.app"
      - name: Generate checksums
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 "$(basename "$DMG_PATH")" > "$(basename "$DMG_PATH").sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tinyprune-release-${{ inputs.tag || github.ref_name }}
          path: |
            ${{ runner.temp }}/TinyPrune-*.dmg
            ${{ runner.temp }}/TinyPrune-*.dmg.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "$DMG_PATH" "$DMG_PATH.sha256" --verify-tag --generate-notes --title "TinyPrune $RELEASE_TAG"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$NOTARY_KEY_PATH" "$RUNNER_TEMP/developer-id.p12"
