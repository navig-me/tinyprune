name: Release macOS application

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to release
        required: true
        type: string
      publish:
        description: Publish GitHub release after signing and notarization
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-14
    environment: release
    env:
      ARCHIVE_PATH: ${{ runner.temp }}/TinyPrune.xcarchive
      STAGING_PATH: ${{ runner.temp }}/TinyPrune-release
      DMG_PATH: ${{ runner.temp }}/TinyPrune.dmg
      KEYCHAIN_PATH: ${{ runner.temp }}/tinyprune-signing.keychain-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Require production package configuration
        run: |
          test -f TinyPrune.xcodeproj/project.pbxproj
          test -f scripts/release/verify-version.sh
          test -f scripts/release/create-dmg.sh
          test -n '${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}'
          test -n '${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}'
          test -n '${{ secrets.APPLE_NOTARY_KEY_ID }}'
          test -n '${{ secrets.APPLE_NOTARY_ISSUER_ID }}'
          test -n '${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}'
      - name: Import Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p '' "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p '' "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - name: Verify version and archive signed app
        run: |
          scripts/release/verify-version.sh "${{ inputs.tag || github.ref_name }}"
          xcodebuild -resolvePackageDependencies -project TinyPrune.xcodeproj -scheme TinyPrune
          xcodebuild archive -project TinyPrune.xcodeproj -scheme TinyPrune -configuration Release -archivePath "$ARCHIVE_PATH"
      - name: Create signed distribution DMG
        run: scripts/release/create-dmg.sh "$ARCHIVE_PATH" "$DMG_PATH" "$STAGING_PATH"
      - name: Notarize and validate distribution
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          xcrun notarytool submit "$DMG_PATH" --key "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          xcrun stapler staple "$DMG_PATH"
          spctl --assess --type open --context context:primary-signature -vv "$DMG_PATH"
      - name: Generate checksums
        run: shasum -a 256 "$DMG_PATH" > "$DMG_PATH.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tinyprune-release-${{ inputs.tag || github.ref_name }}
          path: |
            ${{ runner.temp }}/TinyPrune.dmg
            ${{ runner.temp }}/TinyPrune.dmg.sha256
          if-no-files-found: error
      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release create "$TAG" "$DMG_PATH#TinyPrune.dmg" "$DMG_PATH.sha256#TinyPrune.dmg.sha256" --verify-tag --generate-notes --title "TinyPrune $TAG"
